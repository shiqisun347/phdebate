[program:jixia-moss-realtime]
priority=60
user=moss
directory=/home/ubuntu/sunsq/phdebate-v2
command=/home/ubuntu/sunsq/phdebate-v2/deploy/run-moss-production.sh
environment=HOME="/var/lib/phdebate-moss",PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",MOSS_GATEWAY_PYTHON="/home/ubuntu/sunsq/phdebate-v2/services/moss-realtime-gateway/.venv-cu128/bin/python",OPENMOSS_DEPLOY_ENABLE="I_UNDERSTAND_THIS_STARTS_A_GPU_GATEWAY",MOSS_GPU_LOCK_DIR="/run/lock/phdebate-openmoss",MOSS_GATEWAY_DECODE_CHUNK_FRAMES="3",MOSS_GATEWAY_INITIAL_CHUNK_FRAMES="6",MOSS_GATEWAY_DO_SAMPLE="true",MOSS_GATEWAY_TERMINAL_GRACE_SECONDS="60",MOSS_GATEWAY_CANARY_STAGE_OBSERVABILITY="true",MOSS_GATEWAY_ASYNC_DECODER_ENABLED="false",MOSS_GATEWAY_ASYNC_DECODER_QUEUE_SIZE="2",PYTHONUNBUFFERED="1"
autostart=true
autorestart=unexpected
startsecs=10
startretries=1
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/home/ubuntu/sunsq/phdebate-v2/runtime/logs/moss-realtime.stdout.log
stderr_logfile=/home/ubuntu/sunsq/phdebate-v2/runtime/logs/moss-realtime.stderr.log
stdout_logfile_maxbytes=100MB
stderr_logfile_maxbytes=100MB
