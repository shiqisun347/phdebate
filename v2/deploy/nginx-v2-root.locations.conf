# Replace the parallel `/v2` locations and the legacy `location /` after the
# V2 root-path build has passed acceptance. The legacy process remains bound to
# localhost for proxy-only rollback.
location = /v2 {
    return 308 /;
}

location ~ ^/v2(?<v2_path>/.*)$ {
    return 308 $v2_path$is_args$args;
}

location ~ "^/room/(?<legacy_code>[0-9]{6})/(watch|screen)/?$" {
    return 308 /rooms/$legacy_code/watch$is_args$args;
}

location ~ "^/room/(?<legacy_code>[0-9]{6})/(speaker/[^/]+|debate)/?$" {
    return 308 /rooms/$legacy_code/debate$is_args$args;
}

location ~ "^/room/(?<legacy_code>[0-9]{6})/(admin|host|control)/?$" {
    return 308 /rooms/$legacy_code/control$is_args$args;
}

location ~ "^/room/(?<legacy_code>[0-9]{6})/?$" {
    return 308 /rooms/$legacy_code/watch$is_args$args;
}

location ^~ /rtc {
    proxy_pass http://127.0.0.1:7880;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

location ^~ /api/ {
    client_max_body_size 52m;
    proxy_pass http://jixia_v2_api/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 3600s;
}

location ^~ /media/ {
    proxy_pass http://127.0.0.1:12340/media/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}

location ~ "^/ws/rooms/(?<room_code>[0-9]{6})/?$" {
    proxy_pass http://jixia_v2_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

# Audio and ASR sockets stay pinned to the reliable primary runtime.
location /ws/ {
    proxy_pass http://127.0.0.1:12340/ws/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

location / {
    proxy_pass http://127.0.0.1:12341;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}
