# Add before the existing `location /` inside the HTTPS server block.
location ^~ /rtc {
    proxy_pass http://127.0.0.1:7880;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

location = /v2 {
    proxy_pass http://127.0.0.1:12341;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}

location ^~ /v2/api/ {
    # The application accepts at most 50 MiB of human recording data; leave a
    # small allowance for multipart framing but reject oversized bodies before
    # Nginx buffers them to disk.
    client_max_body_size 52m;
    proxy_pass http://jixia_v2_api/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 3600s;
}

location ^~ /v2/media/ {
    proxy_pass http://127.0.0.1:12340/media/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}

location ~ "^/v2/ws/rooms/(?<room_code>[0-9]{6})/?$" {
    rewrite "^/v2(/ws/rooms/[0-9]{6}/?)$" $1 break;
    proxy_pass http://jixia_v2_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

# Audio and ASR sockets stay pinned to the reliable primary runtime.
location /v2/ws/ {
    proxy_pass http://127.0.0.1:12340/ws/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

location ^~ /v2/ {
    proxy_pass http://127.0.0.1:12341;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}
