; Template only. Every %(ENV_...)s value is required; there are no embedded keys.
; Start supervisord with an environment populated from a protected host config.

[program:openmoss-gateway-1]
directory=%(ENV_PHDEBATE_V2_ROOT)s
command=%(ENV_PHDEBATE_V2_ROOT)s/deploy/openmoss/run-endpoint.sh --endpoint endpoint-1 --port %(ENV_MOSS_EP1_PORT)s --gpu-uuid %(ENV_MOSS_EP1_GPU_UUID)s --gpu-fingerprint %(ENV_MOSS_EP1_GPU_FINGERPRINT)s --prompt-dir %(ENV_MOSS_PROMPT_DIR)s --upstream-checkout %(ENV_MOSS_UPSTREAM_CHECKOUT)s --model-path %(ENV_MOSS_MODEL_PATH)s --tokenizer-path %(ENV_MOSS_TOKENIZER_PATH)s --codec-model-path %(ENV_MOSS_CODEC_MODEL_PATH)s --api-key-file %(ENV_MOSS_EP1_API_KEY_FILE)s --run-manifest %(ENV_MOSS_RUN_DIR)s/endpoint-1.json
user=%(ENV_MOSS_SERVICE_USER)s
autostart=false
autorestart=unexpected
startsecs=10
startretries=1
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=%(ENV_MOSS_LOG_DIR)s/endpoint-1.stdout.log
stderr_logfile=%(ENV_MOSS_LOG_DIR)s/endpoint-1.stderr.log

