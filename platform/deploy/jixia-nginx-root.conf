worker_processes auto;
worker_rlimit_nofile 65535;
pid /run/nginx-jixia.pid;
error_log /home/ubuntu/sunsq/phdebate/runtime/logs/nginx-error.log warn;

events {
    # Each proxied WebSocket uses one downstream and one upstream connection.
    # Keep headroom for spectator bursts plus REST, LiveKit, and agent traffic.
    worker_connections 8192;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /home/ubuntu/sunsq/phdebate/runtime/logs/nginx-access.log;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 200m;
    # The dedicated nginx worker cannot write Debian's default
    # /var/lib/nginx/proxy temp directory. Never spill proxied responses there:
    # a large Next.js chunk was otherwise closed after the first ~64 KiB.
    proxy_max_temp_file_size 0;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream jixia_api {
        least_conn;
        # Community Nginx has no active health checks. Disabling persistent
        # passive eviction lets a failed connection retry the other worker
        # during rolling restarts instead of leaving both workers marked down.
        server 127.0.0.1:12340 max_fails=0;
        server 127.0.0.1:12342 max_fails=0;
        keepalive 32;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name 117.50.192.216 _;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/jixia-acme;
            default_type text/plain;
            try_files $uri =404;
        }

        location / {
            return 301 https://117.50.192.216$request_uri;
        }
    }

    server {
        # SO_REUSEPORT distributes TLS handshakes across all workers instead of
        # making a single accept queue/worker the burst bottleneck.
        listen 443 ssl default_server reuseport backlog=4096;
        listen [::]:443 ssl default_server reuseport backlog=4096;
        server_name 117.50.192.216 _;

        ssl_certificate /etc/letsencrypt/live/117.50.192.216/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/117.50.192.216/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:JixiaTLS:10m;
        ssl_session_timeout 1d;

        # LiveKit signaling shares the trusted site certificate. Media remains
        # end-to-end encrypted WebRTC over the directly exposed ICE ports.
        location ^~ /rtc {
            proxy_pass http://127.0.0.1:7880;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # Authenticated Yjs/Hocuspocus transcript collaboration. Tokens are
        # minted by the platform API and bound to one room document.
        location = /collab {
            proxy_pass http://127.0.0.1:12400;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # Legacy singular room links were printed in earlier QR codes.
        location ~ "^/room/(?<legacy_code>[0-9]{6})/(watch|screen)/?$" {
            return 308 /rooms/$legacy_code/watch$is_args$args;
        }

        location ~ "^/room/(?<legacy_code>[0-9]{6})/(speaker/[^/]+|debate)/?$" {
            return 308 /rooms/$legacy_code/debate$is_args$args;
        }

        location ~ "^/room/(?<legacy_code>[0-9]{6})/(admin|host|control)/?$" {
            return 308 /rooms/$legacy_code/control$is_args$args;
        }

        location ~ "^/room/(?<legacy_code>[0-9]{6})/?$" {
            return 308 /rooms/$legacy_code/watch$is_args$args;
        }

        # Independent Debate Agent control plane and REST/SSE gateway.
        location = /debate/health {
            proxy_pass http://127.0.0.1:18400;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # The judge endpoint is server-to-server only. The main match engine
        # runs on this host and calls it through the public HTTPS address.
        location = /debate/api/judge {
            allow 127.0.0.1;
            allow ::1;
            allow 10.60.103.71;
            allow 117.50.192.216;
            deny all;
            proxy_pass http://127.0.0.1:18400;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location ^~ /debate/api/debate {
            proxy_pass http://127.0.0.1:18400;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 620s;
            proxy_send_timeout 620s;
        }

        location ^~ /debate/api/ {
            proxy_pass http://127.0.0.1:18400;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 620s;
        }

        location ^~ /debate {
            proxy_pass http://127.0.0.1:13300;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
        }

        location = /api/rooms {
            client_max_body_size 52m;
            proxy_request_buffering off;
            proxy_pass http://jixia_api/api/rooms;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 3600s;
        }

        location ^~ /api/rooms/ {
            client_max_body_size 52m;
            proxy_request_buffering off;
            proxy_pass http://jixia_api/api/rooms/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 3600s;
        }

        location ^~ /api/ {
            client_max_body_size 52m;
            proxy_pass http://jixia_api/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 3600s;
        }

        location ^~ /media/ {
            proxy_pass http://127.0.0.1:12340/media/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location ~ "^/ws/rooms/(?<room_code>[0-9]{6})/?$" {
            proxy_pass http://jixia_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # Keep /audio and /asr on the frozen reliable primary playback path.
        location /ws/ {
            proxy_pass http://127.0.0.1:12340/ws/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        location / {
            proxy_pass http://127.0.0.1:12341;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
        }
    }
}
