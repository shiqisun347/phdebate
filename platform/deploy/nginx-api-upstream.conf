# Include once inside nginx's `http {}` block when using either locations-only
# fragment. The standalone jixia-nginx-root.conf already embeds this block.
upstream jixia_api {
    least_conn;
    server 127.0.0.1:12340 max_fails=1 fail_timeout=10s;
    server 127.0.0.1:12342 max_fails=1 fail_timeout=10s;
    keepalive 32;
}
