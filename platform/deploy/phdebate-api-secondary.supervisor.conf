# Initial dual-worker canary only. Install this beside the existing production
# config before replacing that config with phdebate.supervisor.conf. Remove
# this file from supervisor/conf.d once the full config is installed, otherwise
# Supervisor will correctly reject the duplicate program name.
[program:jixia-api-secondary]
priority=31
user=ubuntu
directory=/home/ubuntu/sunsq/phdebate/.api-secondary/apps/api
command=/bin/bash -c 'set -a; source /home/ubuntu/sunsq/phdebate/.env; set +a; export ENGINE_ENABLED=false PRESENCE_RESET_ON_STARTUP=false API_INSTANCE_ID=api-secondary MEDIA_ROOT=/home/ubuntu/sunsq/phdebate/storage/audio ARCHIVE_ROOT=/home/ubuntu/sunsq/phdebate/storage/archives RESEARCH_EXPORT_ROOT=/home/ubuntu/sunsq/phdebate/storage/research-exports BACKUP_STATUS_FILE=/home/ubuntu/sunsq/phdebate/runtime/backup-status.json; exec /home/ubuntu/sunsq/phdebate/deploy/wait-for-postgres.sh -- /home/ubuntu/sunsq/phdebate/.venv/bin/python -m uvicorn app.main:app --host 127.0.0.1 --port 12342 --no-access-log --log-level warning'
environment=HOME="/home/ubuntu",PYTHONPATH="/home/ubuntu/sunsq/phdebate/.api-secondary/apps/api",PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
startsecs=5
startretries=8
stopasgroup=true
killasgroup=true
stdout_logfile=/home/ubuntu/sunsq/phdebate/runtime/logs/api-secondary.stdout.log
stderr_logfile=/home/ubuntu/sunsq/phdebate/runtime/logs/api-secondary.stderr.log
