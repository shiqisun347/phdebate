services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: debate_agent
      POSTGRES_USER: debate_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U debate_agent -d debate_agent"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://debate_agent:${POSTGRES_PASSWORD}@postgres:5432/debate_agent
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      PUBLIC_ORIGIN: https://117.50.218.251
      COOKIE_SECURE: "true"
      AUTO_CREATE_SCHEMA: "false"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  web:
    build: ./apps/web
    depends_on: [api]
    restart: unless-stopped

  nginx:
    image: nginx:1.29-alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_web:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on: [api, web]
    restart: unless-stopped

  certbot:
    image: certbot/certbot:v5.4.0
    volumes:
      - certbot_web:/var/www/certbot
      - letsencrypt:/etc/letsencrypt

volumes:
  postgres_data:
  redis_data:
  certbot_web:
  letsencrypt:
