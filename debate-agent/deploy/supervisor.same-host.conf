[program:jixia-agent-api]
priority=110
user=ubuntu
directory=/home/ubuntu/sunsq/debate-agent/apps/api
command=/bin/bash -c 'set -a; source /home/ubuntu/sunsq/debate-agent/.env; set +a; /home/ubuntu/sunsq/debate-agent/.venv/bin/alembic upgrade head && exec /home/ubuntu/sunsq/debate-agent/.venv/bin/python -m uvicorn app.main:app --host 127.0.0.1 --port 18400 --no-access-log --log-level warning'
environment=HOME="/home/ubuntu",PYTHONPATH="/home/ubuntu/sunsq/debate-agent/apps/api",PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
startsecs=5
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/home/ubuntu/sunsq/debate-agent/runtime/logs/api.stdout.log
stderr_logfile=/home/ubuntu/sunsq/debate-agent/runtime/logs/api.stderr.log

[program:jixia-agent-web]
priority=120
user=ubuntu
directory=/home/ubuntu/sunsq/debate-agent
command=/home/ubuntu/sunsq/phdebate/runtime/node/bin/node /home/ubuntu/sunsq/debate-agent/.web-current/server.js
environment=HOME="/home/ubuntu",PORT="13300",HOSTNAME="127.0.0.1",NODE_ENV="production"
autostart=true
autorestart=true
startsecs=3
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/home/ubuntu/sunsq/debate-agent/runtime/logs/web.stdout.log
stderr_logfile=/home/ubuntu/sunsq/debate-agent/runtime/logs/web.stderr.log

[program:jixia-agent-backup]
priority=130
user=ubuntu
directory=/home/ubuntu/sunsq/debate-agent
command=/home/ubuntu/sunsq/debate-agent/deploy/backup-loop.same-host.sh
environment=HOME="/home/ubuntu",DEBATE_AGENT_ROOT="/home/ubuntu/sunsq/debate-agent"
autostart=true
autorestart=true
startsecs=3
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/home/ubuntu/sunsq/debate-agent/runtime/logs/backup.stdout.log
stderr_logfile=/home/ubuntu/sunsq/debate-agent/runtime/logs/backup.stderr.log
