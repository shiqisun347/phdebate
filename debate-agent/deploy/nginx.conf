events { worker_connections 2048; }
http {
  include /etc/nginx/mime.types;
  server_tokens off;
  limit_req_zone $binary_remote_addr zone=agent_api:10m rate=20r/s;

  upstream agent_api { server api:8400; }
  upstream agent_web { server web:3300; }

  server {
    listen 80;
    server_name 117.50.218.251;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 443 ssl http2;
    server_name 117.50.218.251;
    ssl_certificate /etc/letsencrypt/live/117.50.218.251/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/117.50.218.251/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    client_max_body_size 2m;

    location = / { return 302 /debate; }
    location ^~ /debate/api/debate {
      limit_req zone=agent_api burst=40 nodelay;
      proxy_pass http://agent_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_buffering off;
      proxy_read_timeout 620s;
    }
    location ^~ /debate/api/ {
      proxy_pass http://agent_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 620s;
    }
    location ^~ /debate {
      proxy_pass http://agent_web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }
  }
}
